[project]
name = "ai-document-reader"
version = "0.1.0"
description = "AI-powered document intelligence platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pymongo",
    "python-dotenv",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "pymupdf>=1.28.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "google-genai>=2.16.0",
    "pypdf>=6.14.2",
    "groq>=1.6.0",
    "rank-bm25>=0.2.2",
    "redis[hiredis]>=8.1.0",
    "celery>=5.6.3",
    "aiosmtplib>=5.1.2",
    "pytest",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.19.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "storage",
    "uploads",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # line too long (handled by formatter)
    "B027", # empty method in abstract base class
    "UP007", # use X | Y for type annotations (keep flexible for python versions)
    "B905", # zip without strict
    "B033", # duplicate item in set
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "F401", "B007"]
"app/scripts/**" = ["F841", "B905"]
"app/modules/search/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
