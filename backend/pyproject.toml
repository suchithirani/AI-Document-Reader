[project]
name = "ai-document-reader"
version = "0.1.0"
description = "AI-powered document intelligence platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pymongo",
    "python-dotenv",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "pymupdf>=1.28.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "google-genai>=2.16.0",
    "pypdf>=6.14.2",
    "groq>=1.6.0",
    "rank-bm25>=0.2.2",
    "redis[hiredis]>=8.1.0",
    "celery>=5.6.3",
    "aiosmtplib>=5.1.2",
    "pytest",
    "qdrant-client>=1.19.0",
]

[tool.uv]
package = false
